name: Update README Profile

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows you to run it manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run README Generator
        run: python generate_readme.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🔥 Auto-update README stats [$(date +'%Y-%m-%d %H:%M')]"
          git push
